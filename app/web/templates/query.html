<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Run Queries - CLEAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
    <h1>Run Queries</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} mt-2">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="post">
        <div class="mb-3">
            <label for="query_name" class="form-label">Select Query</label>
            <select class="form-select" id="query_name" name="query_name" required onchange="showParams()">
                <option value="" disabled selected>Select a query</option>
                {% for q in queries_list %}
                    <option value="{{ q }}">{{ q }} - {{ query_help[q] }}</option>
                {% endfor %}
            </select>
        </div>

        <div id="params">
            <div class="mb-3" id="year_div">
                <label for="year" class="form-label">Year</label>
                <input type="number" class="form-control" id="year" name="year">
            </div>
            <div class="mb-3" id="month_div">
                <label for="month" class="form-label">Month</label>
                <input type="number" class="form-control" id="month" name="month" min="1" max="12">
            </div>
            <div class="mb-3" id="similarity_div">
                <label for="similarity_threshold" class="form-label">Similarity Threshold</label>
                <input type="number" class="form-control" id="similarity_threshold" name="similarity_threshold" min="0" max="100">
            </div>
            <div class="mb-3" id="min_tx_div">
                <label for="min_cluster_tx" class="form-label">Minimum Cluster Transactions</label>
                <input type="number" class="form-control" id="min_cluster_tx" name="min_cluster_tx">
            </div>
            <div class="mb-3" id="bucket_div">
                <label for="single_tx_bucket" class="form-label">Small Cluster Bucket Name</label>
                <input type="text" class="form-control" id="single_tx_bucket" name="single_tx_bucket">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Run Query</button>
        <a href="{{ url_for('main.settings') }}" class="btn btn-secondary">Go to Settings</a>
        <a href="{{ url_for('main.import_statements') }}" class="btn btn-secondary">Go to Import</a>
        <a href="{{ url_for('main.manage_categories') }}" class="btn btn-secondary">Go to Categories</a>
    </form>

    {% if result_html %}
        <h2 class="mt-4">Results</h2>
        <div class="table-responsive">
            {{ result_html|safe }}
        </div>
    {% endif %}
</div>

<script>
    function showParams() {
        const query = document.getElementById('query_name').value;
        document.getElementById('year_div').style.display = ['spending_by_month_for_year', 'spending_for_year_month'].includes(query) ? 'block' : 'none';
        document.getElementById('month_div').style.display = query === 'spending_for_year_month' ? 'block' : 'none';
        document.getElementById('similarity_div').style.display = query === 'spending_by_merchant_fuzzy' ? 'block' : 'none';
        document.getElementById('min_tx_div').style.display = query === 'spending_by_merchant_fuzzy' ? 'block' : 'none';
        document.getElementById('bucket_div').style.display = query === 'spending_by_merchant_fuzzy' ? 'block' : 'none';
    }
    window.onload = showParams;
</script>

</body>
</html>
